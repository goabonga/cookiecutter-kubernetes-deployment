[project]
name = "cookiecutter-kustomize-deployment"
version = "0.2.4"
description = "A Cookiecutter template to scaffold Helm + Kustomize Kubernetes deployments with per-environment overlays."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris", email = "goabonga@pm.me" }]
keywords = ["cookiecutter", "kubernetes", "helm", "kustomize", "template", "deployment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/goabonga/cookiecutter-kustomize-deployment"
Repository = "https://github.com/goabonga/cookiecutter-kustomize-deployment"
Issues = "https://github.com/goabonga/cookiecutter-kustomize-deployment/issues"
Changelog = "https://github.com/goabonga/cookiecutter-kustomize-deployment/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The Cookiecutter template lives at the repo root (so `cookiecutter
# gh:goabonga/cookiecutter-kustomize-deployment` keeps working) and is
# force-included into the distribution under an importable package path
# so it can also be published to and consumed from PyPI. cookiecutter.json,
# the templated tree and the generation hooks are all shipped. There is no
# Python module, hence `bypass-selection`.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"cookiecutter.json" = "cookiecutter_kustomize_deployment/cookiecutter.json"
"{{cookiecutter.name}}" = "cookiecutter_kustomize_deployment/{{cookiecutter.name}}"
"hooks" = "cookiecutter_kustomize_deployment/hooks"

[tool.hatch.build.targets.sdist]
include = [
    "cookiecutter.json",
    "{{cookiecutter.name}}",
    "hooks",
    "README.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "cookiecutter>=2.6",
    "pytest>=8.3",
    "pytest-cookies>=0.7",
    "pyyaml>=6.0",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
# The template tree and the generation hooks are Jinja-templated (not
# valid standalone Python/YAML); never lint or format them.
extend-exclude = [".venv", "{{cookiecutter.name}}", "hooks"]
# Honour extend-exclude even when paths are passed explicitly (e.g. by
# pre-commit), so the Jinja hooks are never linted.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
